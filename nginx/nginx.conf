# Прокси-сервер

worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log warn;

events {
    worker_connections  256;
}

http {
    # Типы файлов
    types {
        text/html               html;
        text/css                css;
        application/javascript  js;
        image/png               png;
        image/svg+xml           svg;
        image/x-icon            ico;
    }
    default_type  application/octet-stream;

    # Временные файлы
    client_body_temp_path  temp/client_body;
    proxy_temp_path        temp/proxy;
    fastcgi_temp_path      temp/fastcgi;
    uwsgi_temp_path        temp/uwsgi;
    scgi_temp_path         temp/scgi;

    # Журнал
    log_format  main  '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                      'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log  logs/access.log  main;

    # Общие настройки
    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip               on;
    gzip_types         text/css application/javascript;
    gzip_min_length    512;

    # Приложение
    upstream blog_app {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    server {
        listen       8088;
        listen       [::]:8088;
        server_name  localhost;

        # Размер запроса
        client_max_body_size  64k;

        # Статика
        location /css/ { root ../public; expires 1h; access_log off; }
        location /js/  { root ../public; expires 1h; access_log off; }

        # Проксирование
        location / {
            proxy_pass          http://blog_app;
            proxy_http_version  1.1;
            proxy_set_header    Connection        "";
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_set_header    X-Forwarded-Host  $host:$server_port;

            proxy_connect_timeout  5s;
            proxy_read_timeout     30s;
        }

        # Страница недоступности
        error_page  502 503 504  /50x.html;
        location = /50x.html {
            root      html;
            internal;
        }
    }
}
