name: yutu-app

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-yutu}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-change-me}
    volumes:
      - mongo-data:/data/db
    networks:
      - db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: .
    image: yutu-backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-yutu}:${MONGO_PASSWORD:-change-me}@mongo:27017/yutu?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-change-me}
      CLIENT_URL: http://localhost:${FRONTEND_PORT:-80}
      LOG_DIR: /app/logs
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - backend-logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - db
      - public

  frontend:
    build: ./blog-client
    image: yutu-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public

  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-yutu}:${MONGO_PASSWORD:-change-me}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD:-change-me}
    ports:
      - "${ME_PORT:-8081}:8081"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - db
      - public

volumes:
  mongo-data:
  backend-logs:

networks:
  public:
  db:
    internal: true
